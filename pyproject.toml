[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "llm-eval"
version = "0.1.0"
description = "LLM Evaluation Framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.18"]
mlx = ["mlx>=0.5", "mlx-lm>=0.1"]
rag = ["chromadb>=0.4", "sentence-transformers>=2.0"]
voice = ["soundfile>=0.12", "librosa>=0.10"]
tracing = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
monitoring = ["prometheus-client>=0.20"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3", "mypy>=1.8"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["eval/tests", "models/tests"]
pythonpath = ["."]
