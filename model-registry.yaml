models:
  gpt-4o:
    provider: openai
    model_id: gpt-4o
    type:
      - text
      - rag
    api_key_env: OPENAI_API_KEY

  gpt-4o-mini:
    provider: openai
    model_id: gpt-4o-mini
    type:
      - text
      - rag
    api_key_env: OPENAI_API_KEY

  llama-3.2-1b-local:
    provider: mlx
    model_id: mlx-community/Llama-3.2-1B-Instruct-4bit
    type:
      - text
    extra:
      quantization: 4bit

  whisper-local:
    provider: mlx
    model_id: mlx-community/whisper-large-v3-turbo
    type:
      - voice

  claude-sonnet:
    provider: anthropic
    model_id: claude-sonnet-4-20250514
    type:
      - text
      - rag
    api_key_env: ANTHROPIC_API_KEY

  custom-endpoint:
    provider: custom
    model_id: custom-model
    type:
      - text
    base_url: http://localhost:8080/v1
    api_key_env: CUSTOM_API_KEY
    extra:
      max_tokens: 4096
